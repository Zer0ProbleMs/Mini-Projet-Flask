{% extends "layout.html" %}

{% block title %}
    <title>Ajout de Salle de Cours</title>
{% endblock %}

{% block body %}
    <h1>Ajout d'une salle de cours</h1>

    <div class="container-fluid">
        <h2>Création d'une nouvelle salle de cours</h2>
    </div>

    <form action="/salle-cours/add" method="post">
        <fieldset>
            <input type="hidden" name="id" value="{{ (salleCours | map(attribute='id') | max) + 1 }}">

            <div class="mb-3">
                <label for="nomSalle" class="form-label">Nom de la salle de cours<b>*</b></label>
                <input type="text" class="form-control" id="nomSalle" name="nomSalle" placeholder="Entrez un nom de salle de cours..." required>
            </div>

            <div class="mb-3">
                <label for="typeSalle_id" class="form-label">Type de salle<b>*</b></label>
                <select class="form-select" name="typeSalle_id" id="typeSalle_id" required>
                    <option value="">Sélectionner un type de salle</option>
                    {% for unType in typeSalle %}
                        <option value="{{ unType.id }}">{{ unType.nomTypeSalle }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="etage" class="form-label">Étage</label>
                <input type="number" class="form-control" id="etage" name="etage" placeholder="Entrez l'étage...">
            </div>

            <div class="mb-3">
                <label for="batiment" class="form-label">Bâtiment</label>
                <input type="text" class="form-control" id="batiment" name="batiment" placeholder="Entrez la lettre du bâtiment...">
            </div>

            <div class="mb-3">
                <label for="nbMaxEtudiants" class="form-label">Nombre d'étudiants maximum</label>
                <input type="number" class="form-control" id="nbMaxEtudiants" name="nbMaxEtudiants" placeholder="Entrez le nombre maximum d'étudiants...">
            </div>

            <div class="mb-3">
                <label for="surface" class="form-label">Surface de la salle en m²</label>
                <input type="number" class="form-control" id="surface" name="surface" placeholder="Entrez la surface de la salle...">
            </div>

            <div class="mb-3">
                <label for="nbPrisesCourant" class="form-label">Nombre de prises de courant</label>
                <input type="number" class="form-control" id="nbPrisesCourant" name="nbPrisesCourant" placeholder="Entrez le nombre de prises de courant...">
            </div>

            <div class="mb-3">
                <label for="nbMachines" class="form-label">Nombre de machines</label>
                <input type="number" class="form-control" id="nbMachines" name="nbMachines" placeholder="Entrez le nombre de machines...">
            </div>

            <div class="mb-3">
                <label for="photo" class="form-label">Nom du fichier photo</label>
                <input type="text" class="form-control" id="photo" name="photo" placeholder="Entrez le nom du fichier de la photo...">
            </div>

            <button class="btn btn-outline-success" type="submit">Ajouter</button>
        </fieldset>
    </form>

{% endblock %}
