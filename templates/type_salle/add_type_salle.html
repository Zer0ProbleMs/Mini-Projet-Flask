{% extends "layout.html" %}

{% block title %}
    <title>Ajout d'un type de salle</title>
{% endblock %}

{% block body %}
    <h1>Ajout d'un type de salle</h1>

    <div class="container-fluid">
        <h2>Création d'un nouveau type de salle</h2>
    </div>

    <form action="/type-salle/add" method="post">
        <fieldset>
            <input type="hidden" name="id" value="{{ (typeSalle | map(attribute='id') | max) + 1 }}">

            <div class="mb-3">
                <label for="nomTypeSalle" class="form-label">Nom du type de salle<b>*</b></label>
                <input type="text" class="form-control" id="nomTypeSalle" name="nomTypeSalle" placeholder="Entrez le nom du type de salle..." required>
            </div>

            <div class="mb-3">
                <label for="typeCours" class="form-label">Type de cours</label>
                <select class="form-select" name="typeCours" id="typeCours">
                    <option value="TD">Travaux Dirigés</option>
                    <option value="TP">Travaux Pratiques</option>
                    <option value="CM">Cours Magistraux</option>
                    <option value="None">Aucun</option>
                </select>
            </div>

            <button class="btn btn-outline-success" type="submit">Ajouter</button>
        </fieldset>
    </form>

{% endblock %}
