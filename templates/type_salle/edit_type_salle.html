{% extends "layout.html" %}

{% block title %}
    <title>Page Edit Salle Cours</title>
{% endblock %}

{% block body %}
    <h1>Page de modification de Salle</h1>

    <div class="container-fluid">
        <h2>Vous avez sélectionné le type dont l'identifiant est : {{ typeSalle.id }}</h2>
    </div>

    <form action="/type-salle/edit" method="post">
        <fieldset>
            <input type="hidden" name="id" value="{{ typeSalle.id }}">

            <div class="mb-3">
                <label for="nomType" class="form-label">Nom du type de cours<b>*</b></label>
                <input type="text" class="form-control" id="nomType" name="nomType" placeholder="Entrez le nom du type de cours..." value="{{ typeSalle.nomTypeSalle }}" required>
            </div>

            <div class="mb-3">
                <label for="coursType" class="form-label">Type de cours</label>
                <select class="form-select" name="coursType" id="coursType">
                    <option value="TD">Travaux Dirigés</option>
                    <option value="TP">Travaux Pratiques</option>
                    <option value="CM">Cours Magistraux</option>
                    <option value="None">Aucun</option>
                </select>
            </div>

            <button class="btn btn-outline-success" type="submit">Enregistrer</button>
        </fieldset>
    </form>

{% endblock %}
